format: 2
strand: englisch/wortschatz
title: Werkzeuge für Wörter
intro: "In Mr Hills Klassenchat helfen sich Sophie, Ellie und Amir, wenn ihnen ein Wort fehlt. Du füllst den Werkzeugkoffer für Wörter. Erst umschreibst du ein fehlendes Wort und erschließt ein unbekanntes aus seinen Teilen (Wortfamilie). Dann vergleichst du Englisch mit Deutsch: Verben mit Teilchen (phrasal verbs) und Wörter, die wie deutsche aussehen und etwas anderes bedeuten (false friends)."
languages: [de]
scope:
  text: "Die App zeigt, was Lernende tun können, wenn ihnen ein englisches Wort fehlt oder sie eines nicht kennen, und wo Englisch und Deutsch sich ähnlich oder täuschend verschieden sind. Jedes Werkzeug ist eine Karte im Werkzeugkoffer mit der Frage „Was tun, wenn …?“ und einem kurzen Vorgehen. Kapitel 1 umfasst das Umschreiben (a thing which …, a person who …, ein Gegenteil mit not) und die Wortfamilie (Stamm, Vorsilbe, Nachsilbe: help, helpful, helpless). Kapitel 2 umfasst phrasal verbs (Verb plus Teilchen, das den Sinn ändert, zum Beispiel give up), false friends (Wörter, die wie deutsche aussehen und etwas anderes bedeuten, zum Beispiel become und bekommen) und den Vergleich von Wortbildung, Wortstellung und Ausdruck in Englisch und Deutsch."
  out:
    - Wortfelder zu Situationen (stehen in den Situations-Explainern)
    - Die Fachbegriffe noun und verb (stehen in Hello, Millbrook!)
    - Lautschrift und Aussprache (steht in Klang und Schrift)
chapters: [wenn-ein-wort-fehlt]
