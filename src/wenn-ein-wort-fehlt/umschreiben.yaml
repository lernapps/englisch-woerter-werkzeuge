# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Werkzeug 1: Ein fehlendes Wort umschreiben"
description: "Im Klassenchat fehlt Sophie ein Wort. Du lernst, es mit a thing which … und a person who … zu umschreiben."
competencies: [umschreiben]
scope: Die Seite stellt das Werkzeug Umschreiben vor. Fehlt ein englisches Wort, sagt man, was es ist, und beschreibt es mit einem Relativsatz. Für eine Sache steht a thing which oder a thing that, für eine Person a person who oder a person that. Ein Wort lässt sich auch mit seinem Gegenteil mit not umschreiben (not cheap für expensive). Der Relativsatz kommt aus dem Baustein Notwendige Relativsätze. Nicht hier, weil es spätere Seiten sind. Wortfamilien, phrasal verbs und false friends.
blocks:
  - type: section
    id: einstieg
    title: Ein Wort fehlt im Klassenchat
    blocks:
      - type: text
        text: "Du kennst das: Du willst etwas sagen, aber ein Wort fehlt dir. Sophie geht es im Klassenchat von Mr Hill so. Lies den Chat und achte darauf, was sie tut."
      - type: text
        text: |
          **(1) Sophie:** Hi Ellie! I am in the shop with Mrs Parker. I want to buy a … sorry, I do not know the word!

          **(2) Ellie:** Can you tell me what it is? Then I can help.

          **(3) Sophie:** It's a thing which you use after you write with a pencil. It takes the lines away.

          **(4) Ellie:** Ah, a rubber! They are next to the pencils.

          **(5) Sophie:** Thank you! Amir, what is the word for the man who has the keys for the whole building?

          **(6) Amir:** That's the caretaker. He looks after the school.

          **(7) Mr Hill:** Well done, Sophie! If you do not know a word, do not stop. Say what the thing does. Or say the opposite: "not cheap" is "expensive".

          **(8) Sophie:** Great! Then I can say: "This pen is not cheap."
      - type: vocabulary
        caption: Am Rand des Chats
        languages: { source: de, target: en }
        entries:
          - target: rubber
            source: der Radiergummi
            note: So sagt man es in Großbritannien.
          - target: caretaker
            source: der Hausmeister
      - type: single-choice
        id: umschreiben-start
        text: Was tut Sophie in Zeile (3), als ihr das Wort fehlt?
        options:
          - text: Sie sagt, wofür man die Sache braucht.
            correct: true
            info: Sie beschreibt die Sache, und Ellie errät das Wort.
          - text: Sie hört auf zu schreiben.
            correct: false
            info: Sophie schreibt weiter, wie Mr Hill es in Zeile (7) rät.
          - text: Sie schreibt das Wort in einer anderen Sprache.
            correct: false
            info: Ellie würde das Wort nicht verstehen.
        explanation: Beschreibe die Sache mit Wörtern, die du kennst.
      - type: text
        text: "**Das kannst du danach:** Du umschreibst ein Wort, das dir fehlt, mit einem Relativsatz oder mit seinem Gegenteil."
  - type: section
    id: werkzeug
    title: Die Werkzeugkarte Umschreiben
    blocks:
      - type: figure
        image: images/werkzeugkoffer-1.svg
        alt: Ein Werkzeugkoffer mit fünf Fächern. Das erste Fach ist gefüllt und heißt Umschreiben, die anderen vier sind noch leer.
        caption: Der Werkzeugkoffer hat erst ein Werkzeug.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Werkzeugkarte „Was tun, wenn mir ein Wort fehlt?“
        header: [Schritt, Was du tust, Beispiel]
        rows:
          - ["1", "Sag, was es ist: eine Sache oder eine Person.", "It's a thing … / She is a person …"]
          - [
              "2",
              "Sag mit which, that oder who, was es tut.",
              "a thing which you wear on your feet · a person who works in a hospital",
            ]
          - ["3", "Oder sag das Gegenteil mit not.", "not new = old"]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Für eine **Sache** nimmst du **which** oder **that**, für eine **Person** **who** (oder **that**). Der Relativsatz sagt, was die Sache oder die Person tut. Das Gegenteil mit **not** klappt bei Wörtern mit einem klaren Gegenteil, zum Beispiel old und new.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: umschreiben-zeile
        text: In welcher Zeile des Chats fragt Sophie nach einem Wort für eine Person?
        options:
          - text: Zeile (1)
            correct: false
            info: In Zeile (1) sucht Sophie ein Wort für eine Sache.
          - text: Zeile (5)
            correct: true
            info: Das Wort who zeigt, dass es um eine Person geht.
          - text: Zeile (7)
            correct: false
            info: In Zeile (7) gibt Mr Hill einen Rat.
        explanation: Das Wort who im Relativsatz steht für eine Person.
      - type: language-task
        id: umschreiben-wort
        languages: { source: de, target: en }
        mode: choice
        task: Wähle das Wort, das zur Beschreibung passt.
        form: { case: hint, punctuation: ok }
        items:
          - cue: She is a person who sings songs.
            target: She is a [singer].
            distractors: [[player, reader]]
            mistakes:
              - answer: She is a player.
                message: Ein player spielt. Die Person singt.
              - answer: She is a reader.
                message: Ein reader liest. Die Person singt.
          - cue: It is a thing which you use to write. You can draw with it.
            target: It is a [pencil].
            distractors: [[rubber, ruler]]
            mistakes:
              - answer: It is a rubber.
                message: Mit einem rubber nimmst du Striche weg.
              - answer: It is a ruler.
                message: Mit einem ruler misst du Linien.
        hint: Suche das Wort, das zu what you do passt.
      - type: language-task
        id: umschreiben-relativsatz
        languages: { source: de, target: en }
        mode: write
        task: "Umschreibe das Wort mit einem Relativsatz. Schreibe den englischen Satz."
        form: { case: hint, punctuation: ok }
        items:
          - source: Ein Messer ist eine Sache, mit der man Brot schneidet.
            target: A knife is a thing (which|that) you use to cut bread.
            mistakes:
              - answer: A knife is a thing who you use to cut bread.
                message: Für eine Sache nimmst du which oder that, nicht who.
          - source: Eine Lehrerin ist eine Person, die Kinder in der Schule unterrichtet.
            target: A teacher is a person (who|that) teaches children at school.
            mistakes:
              - answer: A teacher is a person which teaches children at school.
                message: Für eine Person nimmst du who oder that, nicht which.
              - answer: A teacher is a person teaches children at school.
                message: Dir fehlt who.
          - source: Ein Koch ist eine Person, die in der Küche Essen macht.
            target: A cook is a person (who|that) makes food in the kitchen.
            mistakes:
              - answer: A cook is a person which makes food in the kitchen.
                message: Für eine Person nimmst du who oder that, nicht which.
        hint: Erst die Art (thing oder person), dann which, that oder who, dann das Verb.
      - type: ordering
        id: umschreiben-reihenfolge
        text: Bringe die Teile in die richtige Reihenfolge. So umschreibt jemand ein Wort.
        items:
          - It is
          - a thing
          - which
          - you use
          - to open
          - a door
        explanation: Erst steht, was es ist, dann which und was man damit tut.
      - type: single-choice
        id: umschreiben-gegenteil
        text: Dir fehlt das Wort short für eine Person. Welche Umschreibung passt?
        options:
          - text: She is not tall.
            correct: true
            info: Das Gegenteil von tall mit not umschreibt short.
          - text: She is not tired.
            correct: false
            info: tired heißt müde. Das ist nicht das Gegenteil von short.
          - text: She is very tall.
            correct: false
            info: very tall heißt sehr groß. Das ist nicht short.
        explanation: Mit not und dem Gegenteil umschreibst du short.
  - type: section
    id: anwenden
    title: Selbst umschreiben
    blocks:
      - type: open-task
        id: umschreiben-selbst
        task: Wähle eine Sache aus deinem Schulranzen und umschreibe sie in zwei bis drei englischen Sätzen, ohne ihren Namen zu nennen.
        points:
          - text: Sie sagt zuerst, dass es eine Sache ist (It is a thing …).
            source: /wenn-ein-wort-fehlt/umschreiben/#werkzeug
          - text: Sie benutzt einen Relativsatz mit which oder that, der sagt, was man mit der Sache tut.
            source: /wenn-ein-wort-fehlt/umschreiben/#werkzeug
          - text: Ganze Sätze mit Punkt.
            kind: form
        solution: |
          It is a thing which you put in your bag. You use it to measure lines. It has numbers on it.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: Das erste Werkzeug liegt im Koffer. Im nächsten Chat kennt Sophie ein Wort nicht und erschließt es über seine Wortfamilie.
